<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest List Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid #c33;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid #3c3;
    }

    .guests-list {
      margin-top: 2rem;
    }

    .guest-item {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .guest-item:hover {
      transform: translateX(5px);
    }

    .guest-info {
      flex: 1;
    }

    .guest-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 0.25rem;
    }

    .guest-email {
      color: #666;
      font-size: 0.9rem;
    }

    .guest-status {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-invited {
      background: #e3f2fd;
      color: #1976d2;
    }

    .status-confirmed {
      background: #e8f5e9;
      color: #388e3c;
    }

    .status-declined {
      background: #ffebee;
      color: #d32f2f;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 2rem;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 3rem;
      font-size: 1.1rem;
    }

    h2 {
      color: #333;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Guest List Manager</h1>

    <div class="card">
      <h2>Add New Guest</h2>
      <div id="message"></div>
      <form id="guestForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="invited">Invited</option>
            <option value="confirmed">Confirmed</option>
            <option value="declined">Declined</option>
          </select>
        </div>

        <button type="submit">Add Guest</button>
      </form>
    </div>

    <div class="card">
      <h2>Guest List</h2>
      <div id="guestsList"></div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    const form = document.getElementById('guestForm');
    const guestsList = document.getElementById('guestsList');
    const messageDiv = document.getElementById('message');

    function showMessage(text, isError = false) {
      messageDiv.className = isError ? 'error' : 'success';
      messageDiv.textContent = text;
      setTimeout(() => {
        messageDiv.textContent = '';
        messageDiv.className = '';
      }, 3000);
    }

    async function loadGuests() {
      try {
        guestsList.innerHTML = '<div class="loading">Loading guests...</div>';

        const response = await fetch(`${API_BASE}/guests`);
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error);
        }

        if (result.data.length === 0) {
          guestsList.innerHTML = '<div class="empty-state">No guests yet. Add your first guest above!</div>';
          return;
        }

        guestsList.innerHTML = result.data.map(guest => `
          <div class="guest-item">
            <div class="guest-info">
              <div class="guest-name">${escapeHtml(guest.name)}</div>
              <div class="guest-email">${escapeHtml(guest.email)}</div>
            </div>
            <span class="guest-status status-${guest.status}">${guest.status}</span>
          </div>
        `).join('');
      } catch (error) {
        guestsList.innerHTML = `<div class="error">Failed to load guests: ${error.message}</div>`;
      }
    }

    async function addGuest(event) {
      event.preventDefault();

      const formData = new FormData(form);
      const guestData = {
        name: formData.get('name'),
        email: formData.get('email'),
        status: formData.get('status')
      };

      try {
        const response = await fetch(`${API_BASE}/guests`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(guestData)
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error);
        }

        showMessage('Guest added successfully!');
        form.reset();
        loadGuests();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener('submit', addGuest);
    loadGuests();
  </script>
</body>
</html>
